<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AiUniverse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#161210;color:#F6EDE4;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:96px}
h1,h2,.zahl{font-family:"Space Grotesk",sans-serif}
.kopf{padding:16px 16px 12px;background:linear-gradient(180deg,#261C16,#161210);border-bottom:1px solid #3E2E26;position:sticky;top:0;z-index:5}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:12px}
.punkt{width:9px;height:9px;border-radius:50%;background:#C6E07A;box-shadow:0 0 10px rgba(198,224,122,.8);flex:none}
.punkt.aus{background:#6A5648;box-shadow:none}
.kname{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unter{font-size:11px;color:#C4A898;margin-top:1px}
.knopf{background:#2E221C;border:1px solid #6A5244;color:#F0E2D4;border-radius:10px;padding:11px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;min-height:44px}
.knopf:active{background:#3E2C22;border-color:#7A6252}
.knopf:disabled{opacity:.45}
.or{background:#E39B45;border:none;color:#1C1208;font-weight:700;font-family:"Space Grotesk",sans-serif;letter-spacing:.03em}
.rot{color:#FF7A7A}
.stand:not(:empty){margin-top:12px}
.fehlt{display:block;width:100%;text-align:left;background:#2A1B14;border:1px solid #6B3E1E;
 border-radius:10px;padding:9px 11px;color:#E8B98A;font:inherit;font-size:11.5px;line-height:1.45;cursor:pointer}
.fehlt b{color:#F5C78F}
.gruen{color:#C6E07A}.grau{color:#A88878}
.reiter{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px 16px 0}
.reiter button{background:#1E1612;border:1px solid #3E3028;border-radius:12px;padding:11px 4px;color:#D4C0B0;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;line-height:1.3}
.reiter button.an{background:#E39B45;border-color:#E39B45;color:#1C1208;box-shadow:0 6px 16px rgba(227,155,69,.34)}
.erkl{display:flex;gap:9px;margin:11px 16px 0;padding:11px 12px;background:rgba(227,155,69,.10);border:1px solid rgba(227,155,69,.34);border-radius:12px;font-size:11.5px;line-height:1.5;color:#EADCCE}
.erkl i{width:7px;height:7px;border-radius:50%;background:#E39B45;margin-top:5px;flex:none}
/* Unten steht die feste Leiste mit VIDEO ERZEUGEN, bei einem laufenden
   Bau zusaetzlich die Statuszeile. Ohne Abstand verschwindet die letzte
   Karte dahinter - genau das ist bei den fertigen Videos passiert. */
.inhalt{padding:12px 16px calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.karte{background:linear-gradient(180deg,#2A1E18,#1A1410);border:1px solid #463428;border-radius:16px;padding:4px 13px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.karte.p{padding:13px}
.kt{font-family:"Space Grotesk",sans-serif;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#C8B0A0;margin:0 0 9px}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #3E2E26}
.r:last-child{border-bottom:none}
.rw{border-bottom:1px solid #3E2E26}
.rw:last-child{border-bottom:none}
.rw>.r{border-bottom:none}
.frag{flex:0 0 auto;width:18px;height:18px;line-height:16px;padding:0;border-radius:50%;background:#2A201A;border:1px solid #4E3A2E;color:#C8B0A0;font:inherit;font-size:11px;cursor:pointer;vertical-align:middle}
.frag.an{background:#E39B45;border-color:#E39B45;color:#1C1208;font-weight:600}
.erk{font-size:11.5px;line-height:1.55;color:#D8C4B4;background:#221812;border-left:2px solid #E39B45;border-radius:0 7px 7px 0;padding:9px 11px;margin:0 0 11px}
.szf{margin:9px 0}
.szf .szh{display:block;margin-bottom:4px}
.szf textarea{min-height:52px}
.dz{border-top:1px solid #3E2E26;padding:10px 0}
.dz:first-of-type{border-top:none}
.dznr{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#B09080;margin-bottom:5px}
.dzz{font-size:12px;line-height:1.5;color:#EADCCE;margin:3px 0;padding-left:9px;border-left:2px solid #4E3A2E}
.dzz span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#B09080}
.dzz.av{border-left-color:#E39B45}.dzz.bi{border-left-color:#C6E07A}.dzz.be{border-left-color:#E8B98A}
.erk b{color:#F8EEE4}.erk i{color:#F0C48A;font-style:italic}
.r label,.r .lb{font-size:12.5px;color:#EADCCE}
.r .lb{display:flex;align-items:center;gap:6px}
.r .hint{font-size:10.5px;color:#C4A898;margin-top:2px}
input[type=text],input[type=number],select,textarea{background:#120E0C;border:1px solid #4E3A2E;border-radius:9px;color:#F6EDE4;padding:8px 9px;font:inherit;font-size:12.5px}
input[type=text],input[type=number]{text-align:right;width:92px}
input.breit{text-align:left;width:100%}
/* Ein select ist so breit wie sein laengster Eintrag, wenn man es laesst.
   Lange Stimmennamen haben damit die ganze Seite breiter gemacht, und man
   konnte sie seitlich wegschieben. min-width:0 erlaubt dem Feld, kleiner
   zu werden als sein Inhalt - dann wird der Text abgeschnitten. */
select{width:auto;max-width:100%;min-width:0}
/* Ein Kind einer Flex-Zeile weigert sich von Haus aus, schmaler zu werden
   als sein Inhalt. Darum hat die Zeile mit Auswahlfeld und Abspielknopf
   die Seite aufgeblasen, obwohl das Feld selbst schon schrumpfen durfte. */
.szz>div{min-width:0}
textarea{width:100%;text-align:left;resize:vertical;min-height:92px;line-height:1.55;font-size:12px}
.sch{width:46px;height:26px;border-radius:999px;background:#3A2C24;position:relative;flex:none;border:none;cursor:pointer;padding:0}
.sch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#A88878;transition:.15s}
.sch.an{background:#E39B45}.sch.an i{left:23px;background:#1C1208}
.pills{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;max-width:62%;justify-content:flex-end}
.pills button{background:#2A201A;border:1px solid #4E3A2E;color:#C8B0A0;border-radius:8px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer}
.pills button.an{background:#E39B45;border-color:#E39B45;color:#1C1208;font-weight:600}
.liste .e{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #32261E}
.liste .e:last-child{border-bottom:none}
.e .tx{flex:1;min-width:0}
.e .ti{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .me{font-size:10.5px;color:#C4A898;margin-top:2px}
.ik{width:34px;height:34px;border-radius:9px;background:#2A201A;border:1px solid #4E3A2E;color:#F3E6D8;font-size:14px;cursor:pointer;flex:none}
.leer{color:#A88878;font-size:12px;padding:12px 0;text-align:center}
.leiste{position:fixed;left:0;right:0;bottom:0;padding:11px 16px calc(14px + env(safe-area-inset-bottom));background:#161210;border-top:1px solid #3E2E26;display:flex;flex-wrap:wrap;align-items:center;gap:11px;z-index:6}
.lauf{flex:0 0 100%;display:none;align-items:center;gap:9px;padding:8px 11px;margin:-2px 0 2px;background:#261C16;border:1px solid #463428;border-radius:11px;font-size:12.5px;color:#EADCCE}
.lauf.an{display:flex}
.lauf .pk{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#E39B45;animation:pul 1.3s ease-in-out infinite}
.lauf .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lauf .zt{flex:0 0 auto;color:#C0A898;font-variant-numeric:tabular-nums}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.25}}
.leiste .pr{flex:none}
.leiste .pr .t{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#B09080}
.leiste .pr .w{font-size:19px;font-weight:700;font-family:"Space Grotesk",sans-serif}
.gen{flex:1;border-radius:14px;padding:16px 10px;font-size:15px}
.dim{position:fixed;inset:0;background:rgba(18,10,6,.82);z-index:20;display:flex;align-items:flex-end;padding:16px}
.dlg{background:linear-gradient(180deg,#2C2018,#1A1410);border:1px solid #6A5244;border-radius:22px;padding:20px;width:100%;box-shadow:0 28px 60px rgba(0,0,0,.8)}
.dlg h2{margin:0 0 4px;font-size:18px}
.dlg p{margin:0 0 14px;font-size:12.5px;color:#C8B0A0;line-height:1.5}
.dlg .zw{display:flex;gap:10px}
.dlg .zw button{flex:1;border-radius:14px;padding:15px 8px;font-size:14px}
.log{font:11px/1.6 ui-monospace,monospace;color:#C0A898;white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
.hinw{font-size:10.5px;color:#A88878;padding:4px 0 10px}
.kind{padding-left:16px}
.szn{background:#1E1612;border:2px solid #5A4436;border-radius:14px;padding:12px;margin-bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.szn+.szn{margin-top:0}
.szn .kopf{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:static;top:auto;z-index:auto;padding:0;background:none;border-bottom:0}
.szn .nr{font-size:11px;color:#E0CDB8;letter-spacing:.08em;flex:1;font-weight:600}
.szn .bildchen{width:100%;height:132px;object-fit:cover;border-radius:9px;background:#161210;display:block}
.szn textarea{width:100%;min-height:58px;margin-top:8px}
.szz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.szh{font-size:10.5px;color:#C4A898}
.hak{display:flex;align-items:center;gap:6px;font-size:12px;color:#D4C0B0;cursor:pointer}
.hak input{width:17px;height:17px;accent-color:#E39B45}
.hak.aus{opacity:.45}
.szn select,.szn input[type=text]{font-size:12px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.zl{background:#1E1612;border:1px solid #3E2E26;border-radius:9px;padding:7px 9px}
.zt{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:#B09080}
.zw{font-size:12px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me.warn{color:#E39B45}
.suchf{margin:12px 16px 0;position:relative}
.suchf input[type=text]{width:100%;box-sizing:border-box;text-align:left;background:#1E1612;border:1px solid #3E3028;border-radius:12px;padding:11px 13px;color:#F6EDE4;font:inherit;font-size:13.5px}
.suchf input::placeholder{color:#8C7468}
.sucherg:empty{display:none}
.sucherg{position:absolute;left:0;right:0;top:46px;z-index:40;background:#2A1E18;border:1px solid #463428;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.sucherg div{padding:11px 13px;border-bottom:1px solid #32261E;font-size:13px;cursor:pointer}
.sucherg div:last-child{border-bottom:none}
.sucherg div:active{background:#32261E}
.sucherg b{color:#E39B45;font-weight:600}
.sucherg span{display:block;color:#A88878;font-size:11px;margin-top:2px}
.treffer{animation:blitz 2s ease-out}
@keyframes blitz{0%,55%{background:rgba(227,155,69,.28)}100%{background:transparent}}
.spaeter{margin:0 0 4px;padding:10px 12px;background:#1E1612;border:1px dashed #6A5244;border-radius:11px;font-size:11.5px;line-height:1.5;color:#B09888}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;
 outline:none;border:1px solid #4E3A2E;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
 border-radius:50%;background:#fff;border:2px solid #161210;box-shadow:0 1px 4px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;
 border:2px solid #161210}

/* Minus/Plus statt Schieberegler */
.stufen{display:flex;align-items:center;gap:4px}
.stufen .stuf{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid #4E3A2E;
  background:#2A201A;color:#F6EDE4;font-size:19px;font-weight:700;line-height:1;cursor:pointer}
.stufen .stuf:active{background:#E39B45;color:#1C1208;border-color:#E39B45}
.stufwert{min-width:52px;text-align:center;font-size:14px;font-weight:700;color:#F6EDE4;
  font-variant-numeric:tabular-nums}
.stufwert i{font-style:normal;color:#C8B0A0;font-size:11px;margin-left:2px}

/* Farbfelder statt Farbregler */
.farbfeld{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:214px}
.farbfeld .fb{width:30px;height:30px;flex:none;border-radius:8px;cursor:pointer;
  border:2px solid #4E3A2E;padding:0}
.farbfeld .fb.an{border-color:#F6EDE4;box-shadow:0 0 0 2px #E39B45}

/* Eingeklappte Abschnitte in den Einstellungen */
details.falt{background:linear-gradient(180deg,#2A1E18,#1A1410);border:1px solid #463428;
  border-radius:16px;margin:0 0 11px;overflow:hidden}
details.falt>summary{list-style:none;cursor:pointer;padding:15px 15px;font-family:"Space Grotesk",sans-serif;
  font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#EADCCE;
  display:flex;align-items:center;justify-content:space-between}
details.falt>summary::-webkit-details-marker{display:none}
details.falt>summary::after{content:"▾";color:#B09080;font-size:15px;transition:transform .15s}
details.falt[open]>summary::after{transform:rotate(180deg)}
details.falt[open]>summary{color:#E39B45;border-bottom:1px solid #3E2E26}
details.falt .faltin{padding:12px 0 2px}
details.falt .faltin>.karte{box-shadow:none;border-radius:0;border-left:0;border-right:0;
  background:transparent;border-color:#32261E}
details.falt .faltin>.karte:last-child{border-bottom:0}

/* Zweitrangiges je Szene, eingeklappt */
details.mehr{margin:9px 0 2px;border-top:1px solid #3E2E26;padding-top:4px}
details.mehr>summary{list-style:none;cursor:pointer;font-size:12px;color:#C8B0A0;
  padding:7px 0;display:flex;align-items:center;gap:6px}
details.mehr>summary::-webkit-details-marker{display:none}
details.mehr>summary::before{content:"▸";color:#B09080;font-size:12px}
details.mehr[open]>summary::before{content:"▾"}
details.mehr[open]>summary{color:#E39B45}

/* Ein Avatar, der fuer dieses Video angehakt ist */
.karte.mit{border-color:#E39B45}

/* Der Dreifachschalter je Szene */
.schalt{display:flex;gap:6px;margin:10px 0 2px}
.schalt .st{flex:1;padding:10px 6px;border-radius:9px;border:1px solid #4E3A2E;
  background:#2A1E18;color:#C8B0A0;font-size:11.5px;font-weight:600;
  line-height:1.3;cursor:pointer;text-align:center}
.schalt .st.an{border-color:#E39B45;color:#F6EDE4;background:rgba(227,155,69,.16)}
/* Der Verlauf: die letzten Fassungen, antippbar */
.verl{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.verl img,.verl video{width:46px;height:62px;object-fit:cover;border-radius:6px;
  background:#161210;cursor:pointer;border:1px solid #4E3A2E;display:block}
.verl img:hover,.verl video:hover{border-color:#E39B45}

/* Wer in der Szene im Bild steht */
.wer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
.wer .wn{padding:7px 13px;border-radius:999px;border:1px solid #4E3A2E;
  background:#2A1E18;color:#C8B0A0;font-size:12.5px;font-weight:600;cursor:pointer}
.wer .wn.an{border-color:#E39B45;color:#F6EDE4;background:rgba(227,155,69,.16)}
</style>
</head>
<body>

<div class="kopf">
  <div class="zeile">
    <div style="display:flex;align-items:center;gap:9px;min-width:0">
      <span class="punkt" id="pt"></span>
      <div style="min-width:0">
        <div class="kname" id="knam">—</div>
        <div class="unter" id="kunt"></div>
      </div>
    </div>
    <button class="knopf" onclick="zeige('kanaele')">Kanäle</button>
  </div>
  <div class="stand" id="stand"></div>
</div>

<div class="suchf"><input type="text" id="suchf" placeholder="Suchen: Untertitel, Abspann, Musik, Tempo …" oninput="suchTreffer(this.value)" onblur="setTimeout(suchZu,220)"><div class="sucherg" id="sucherg"></div></div>
<div class="reiter" id="reiter"></div>
<div class="erkl"><i></i><span id="erkl"></span></div>
<div class="inhalt" id="inhalt"></div>

<div class="leiste" id="leiste">
  <div class="lauf" id="lauf"><span class="pk"></span><span class="tx" id="laufTx">läuft …</span><span class="zt" id="laufZt"></span></div>
  <div class="pr"><div class="t">Kostet</div><div class="w" id="preis">—</div></div>
  <button class="knopf or gen" id="gen" onclick="fragGenerieren()">VIDEO ERZEUGEN</button>
</div>

<div id="dialog"></div>

<script>
var S={offen:{},erk:{},kanal:null,tab:"machen",spielt:null,daten:{},einst:{},themen:{offen:[],erledigt:[]},videos:[],preis:{},modelle:null,szenen:null,tg:null,fig:null,gs:null,arten:null,vorlagen:{},schluessel:{},guthaben:null,schriften:null};

var TABS=[
 ["machen","Video machen","Thema, Text, Szenen und Clips. Hier entsteht das Video."],
 ["darsteller","Avatare & Sprecher","Wer mitspielt und wie er klingt. Avatare stehen im Bild, Sprecher reden nur."],
 ["einst","Einstellungen","Format, Ton, Untertitel, Abspann, Modelle und Kanäle."]
];

function h(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
/* Ohne Content-Type-Kopf lief hier frueher .indexOf auf null und warf.
   Das hat jeden Serverfehler als "Verbindung abgebrochen" aussehen lassen. */
function api(w,d){
  return fetch(w,d?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}:undefined)
   .then(function(r){
     var ct=r.headers.get("content-type")||"";
     if(ct.indexOf("json")>=0)return r.json();
     return r.text().then(function(x){
       if(r.ok)return x;
       return {ok:false,fehler:"Der Server hat Fehler "+r.status+" gemeldet"+(x?": "+String(x).slice(0,160):".")};
     });
   });
}
function el(id){return document.getElementById(id)}

function frage(titel,text,knopf,fn,gefahr){
  el("dialog").innerHTML='<div class="dim" onclick="if(event.target===this)zu()"><div class="dlg">'
   +'<h2>'+h(titel)+'</h2><p>'+text+'</p><div class="zw">'
   +'<button class="knopf" onclick="zu()">Abbrechen</button>'
   +'<button class="knopf '+(gefahr?"":"or")+'" id="ja" style="'+(gefahr?"background:#9B2C3B;border-color:#9B2C3B;color:#fff;font-weight:700":"")+'">'+h(knopf)+'</button>'
   +'</div></div></div>';
  el("ja").onclick=function(){zu();fn()};
}
function zu(){el("dialog").innerHTML=""}
function melde(t){el("dialog").innerHTML='<div class="dim" onclick="zu()"><div class="dlg"><h2>Hinweis</h2><p>'+h(t)+'</p><div class="zw"><button class="knopf or" onclick="zu()">Alles klar</button></div></div></div>'}

function kanalDaten(){for(var i=0;i<(S.daten.kanaele||[]).length;i++){if(S.daten.kanaele[i].key===S.kanal)return S.daten.kanaele[i]}return null}

function laden(){
  /* Der erste Aufruf ging ohne ?k= raus. Der Server kennt dann keinen
     Kanal und meldet jedes Modell als fehlend. Das Ergebnis landete in
     S.daten.apis, und zeigeKopf() hat sofort danach die Zeile "fehlt
     noch" daraus gebaut - mit Zahlen, die zu keinem Kanal gehoerten.
     Der zweite Aufruf weiter unten hat es zwar richtiggestellt, aber
     nur wenn er auch durchkam. Jetzt geht schon der erste Aufruf mit
     dem Kanal raus, und die Zeile wird nur gezeichnet, wenn die Daten
     nachweislich zu diesem Kanal gehoeren (S.apis_von). */
  var merk=S.kanal||kanalGemerkt()||"";
  return api("/api/stand"+(merk?"?k="+encodeURIComponent(merk):"")).then(function(d){
    S.daten=d;
    var ks=d.kanaele||[];
    if(!S.kanal||!kanalDaten()){
      var gm=kanalGemerkt(), da=false;
      for(var i=0;i<ks.length;i++){if(ks[i].key===gm)da=true}
      S.kanal=da?gm:(ks.length?ks[0].key:null);
    }
    S.apis_von=merk;
    zeigeKopf();
    if(!S.kanal)return;

function frHex(h,s,l){
  s=s/100; l=l/100;
  var k=function(n){return (n+h/30)%12};
  var a=s*Math.min(l,1-l);
  var f=function(n){var v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
                    return Math.round(255*v)};
  return '#'+[f(0),f(8),f(4)].map(function(x){return ('0'+x.toString(16)).slice(-2)})
         .join('').toUpperCase();
}
function frHsl(hex){
  var s=String(hex||'#FFFFFF').replace('#','');
  if(s.length!==6)s='FFFFFF';
  var r=parseInt(s.substr(0,2),16)/255, g=parseInt(s.substr(2,2),16)/255, b=parseInt(s.substr(4,2),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, l=(mx+mn)/2;
  var sa=d===0?0:d/(1-Math.abs(2*l-1));
  if(d!==0){
    if(mx===r)h=60*(((g-b)/d)%6);
    else if(mx===g)h=60*(((b-r)/d)+2);
    else h=60*(((r-g)/d)+4);
  }
  if(h<0)h+=360;
  return [Math.round(h), Math.round(sa*100), Math.round(l*100)];
}

function utStandard(welche){

  var n=+(S.einst.untertitel_woerter||3);

  var sh={1:1.12,2:1.0,3:0.88,4:0.78,5:0.70,6:0.64}[n]||0.78;
  var H=1920, fs, mv, rand, scha;
  if(st==="kino"){
    fs=Math.max(18,Math.floor(H*0.032*g/48*(0.92+0.08*sh)));
    mv=47; rand=Math.max(2,Math.floor(fs*0.10)); scha=0;
  }else if(st==="fett"){
    fs=Math.max(28,Math.floor(H*0.058*g/48*sh));
    mv=30; rand=Math.max(4,Math.floor(fs*0.14)); scha=Math.max(2,Math.floor(fs*0.06));
  }else if(st==="knall"){
    fs=Math.max(30,Math.floor(H*0.056*g/48*sh));

    fs=Math.max(28,Math.floor(H*0.050*g/48*sh));
    mv=40; rand=Math.max(3,Math.floor(fs*0.13)); scha=0;
  }else if(st==="wortweise"){
    fs=Math.max(30,Math.floor(H*0.050*g/48*sh));
    mv=47; rand=Math.max(3,Math.floor(fs*0.10)); scha=0;

/* Wie lang das fertige Video wird. "Länge in Sekunden" ist nur der
   gesprochene Teil - Abspann und Nachlauf kommen oben drauf, und genau
   deshalb kam bei 90 eingestellt ein Video von 99 heraus. */
function abspannSek(){
  var d=S.ab; if(!d)return null;
  var li=d.eintraege||[], wahl=d.wahl||"";
  for(var i=0;i<li.length;i++){
    if(li[i].id===wahl||(!wahl&&i===0))return Number(li[i].sekunden)||0;
  }
  return li.length?(Number(li[0].sekunden)||0):0;
}
function laengeVorschau(){
  var gesprochen=Number(S.einst.laenge)||0;
  var nach=(S.einst.nachlauf===undefined?0.9:Number(S.einst.nachlauf))||0;
  var ab=abspannSek();
  if(ab===null){ladeAbspann();ab=0}
  var fertig=gesprochen+nach+ab;
  var teile='gesprochen '+gesprochen+' s';
  if(nach)teile+=' + Nachlauf '+String(nach).replace(".",",")+' s';
  teile+=' + Abspann '+(ab?(String(ab).replace(".",",")+' s'):'0 s (keiner gewählt)');
  var warn=(fertig<63)
    ?'<br><span style="color:#FFB454">Unter 63 Sekunden — fürs Monetarisieren solltest '
     +'du über einer Minute landen, mit etwas Luft. Die Stimme spricht nicht immer '
     +'gleich schnell.</span>':'';
  return '<div class="szh" style="margin-top:7px;line-height:1.5">'
   +'<b>Fertiges Video: etwa '+(Math.round(fertig*10)/10).toString().replace(".",",")+' Sekunden</b><br>'
   +teile+warn+'</div>';
}
function tAblauf(){
  return '<div class="karte">'
   +reihe("Länge in Sekunden",zahl("laenge",S.einst.laenge||20,1),"nur der gesprochene Teil")
   +laengeVorschau()
   +reihe("Sprechtempo",knoepfe("woerter_pro_sekunde",String(S.einst.woerter_pro_sekunde||2.5),[["2.2","ruhig"],["2.5","normal"],["2.8","flott"]]),"Wörter je Sekunde")
   +'</div>';
}

function tLauf(){
  var l=S.daten.lauf||{};
  if(!(l.laeuft||(l.zeilen&&l.zeilen.length)))return '';
  var text=(l.zeilen||[]).join("\n");
  var fertig=!l.laeuft&&/FERTIG in/.test(text);
  return '<div class="karte p"'+(fertig?' style="border:2px solid #37D67A"':'')+'><h2 class="kt">'
    +(l.laeuft?"Läuft gerade":(fertig?'<span style="color:#37D67A">● Fertig</span>':"Letzter Lauf"))+'</h2><div class="log">'
    +h((l.zeilen||[]).join("\n")||"—")+'</div>'
    +(l.laeuft?'<button class="knopf" style="width:100%;margin-top:10px" onclick="abbrechen()">Abbrechen</button>':'')+'</div>';
}

function tVideos(){
  var o='<div class="karte p"><h2 class="kt">Fertige Videos</h2><div class="liste">';
  if(!S.videos.length)o+='<div class="leer">noch keine</div>';
  S.videos.forEach(function(v){
    var laeuft=(S.spielt===v.ordner);
    /* Gerade fertig geworden: gruen umrandet, damit man es sofort sieht. */
    var roh=(v.fertig===false);          /* wird noch geschrieben */
    var frisch=!roh&&(v.alter_min!=null&&v.alter_min<=30);
    var rahmen=roh?'border:2px solid #FFB454;background:rgba(255,180,84,.07)'
                  :(frisch?'border:2px solid #37D67A;background:rgba(55,214,122,.07)':'');
    o+='<div class="e"'+(rahmen?' style="'+rahmen+';border-radius:12px;padding:9px 10px"':'')+'>'
      +'<div class="tx"><div class="ti">'
      +(roh?'<span style="color:#FFB454">● wird gebaut </span>':'')
      +(frisch?'<span style="color:#37D67A">● NEU </span>':'')+h(v.titel)+'</div>'
      +'<div class="me">'+h(v.zeit)+' · '+v.mb+' MB'
      +(roh?' · noch nicht abspielbar':(frisch?' · gerade fertig':''))+'</div></div>'
      +'<button class="ik"'+(roh?' disabled':'')+' onclick="spiel(\''+v.ordner+'\')">'+(laeuft?"✕":"▶")+'</button>'
      +'<button class="ik"'+(roh?' disabled':'')+' onclick="herunter(\''+v.ordner+'\')">⤓</button>'
      +'<button class="ik rot" onclick="fragWeg(\''+v.ordner+'\',\''+h(v.titel).replace(/'/g,"")+'\')">✕</button></div>';
    if(laeuft)
      o+='<div class="szz" style="display:block;margin:4px 0 10px">'
       +'<video src="/video/'+encodeURIComponent(v.ordner)+'" controls playsinline preload="metadata" '

       +'im Videoplayer des Handys ansehen.</div></div>';
  });
  o+='</div><div class="hinw">Vor jedem Löschen kommt eine Abfrage.</div></div>';
  return o;
}

function tStart(){

}

function tMachen(){

  return tWie()+tStartKopf()+tAbspannWahl()+tPrompt()+tLauf()+tVideos();

/* Beim Neuzeichnen wird die Seite komplett neu aufgebaut. Ohne das hier
   klappt jede geoeffnete Lade bei jeder Aenderung wieder zu. */
function faltSchluessel(t){return String(t||"").replace(/[^a-zA-Z0-9]+/g,"_").slice(0,40)}

function faltMerk(d){
  var k=d.getAttribute("data-falt");
  if(!k)return;
  if(!S.offen)S.offen={};
  if(d.open)S.offen[k]=1; else delete S.offen[k];
}

function faltOffen(k,standard){
  if(!S.offen)S.offen={};
  return S.offen[k]?true:!!standard;
}

function falte(titel,inhalt,offen){
  var k=faltSchluessel(titel);
  return '<details class="falt" data-falt="'+k+'" ontoggle="faltMerk(this)"'
   +(faltOffen(k,offen)?' open':'')+'>'
   +'<summary>'+h(titel)+'</summary>'
   +'<div class="faltin">'+inhalt+'</div></details>';
}

  }else{
    o+='<div class="r" style="padding-top:0"><div class="lb">Text</div><div class="zahl">'+(p.text||0).toFixed(2)+' €</div></div>'
      +'<div class="r"><div class="lb">'+(p.bilder||0)+' Bilder</div><div class="zahl">'+(((p.bilder||0)*(p.je_bild||0))||0).toFixed(2)+' €</div></div>'
      +'<div class="r"><div class="lb">Stimme</div><div class="zahl">'+(p.stimme||0).toFixed(2)+' €</div></div>'
      +'<div class="r"><div class="lb"><b>Zusammen</b></div><div class="zahl"><b>'+(p.gesamt||0).toFixed(2)+' €</b></div></div>'
      +'<div class="hinw" style="margin-top:8px">Bei '+(p.sekunden||0)+' Sekunden. Ändert sich mit Länge und Bildern pro Minute.</div></div>';
  }

  o+='<div class="karte p"><h2 class="kt">Guthaben</h2>'
   +'<div class="r" style="padding-top:0"><div><div class="lb">fal.ai</div><div class="hint">Bilder und Stimme</div></div>'
   +'<div style="display:flex;align-items:center;gap:8px"><span class="zahl" style="font-size:15px;font-weight:700">'
   +(S.guthaben?(S.guthaben.ok?Number(S.guthaben.betrag).toFixed(2)+" "+S.guthaben.waehrung:h(S.guthaben.text)):"—")
   +'</span><button class="knopf" onclick="holGuthaben()">abrufen</button></div></div></div>';

  /* avatar kann keinen Hintergrund und wird nicht gebraucht, Geraeusche
     sind raus. "video" (Bild bewegen) MUSS sichtbar sein - ohne das
     Modell geht die Schalterstellung "Nur Bild, bewegt" nicht. */
  (m.slots||[]).filter(function(s){
    return s!=="avatar"&&s!=="sound";
  }).forEach(function(s){
    var liste=(m.apis||{})[s]||[];
    o+='<div class="karte p" id="slot_'+s+'"><h2 class="kt">'+h(SLOTNAME[s]||s)+'</h2>'
     +(SLOTWOZU[s]?'<div class="szh" style="margin:-4px 0 9px">'+h(SLOTWOZU[s])+'</div>':'')
     +(s==="ref"?refAnleitung(liste.length):'')
     +'<div class="liste">';
    if(!liste.length)o+='<div class="leer">nichts eingetragen</div>';
    liste.forEach(function(e,i){
      o+='<div class="e"><button class="ik" style="'+(e.aktiv?"background:#E39B45;border-color:#E39B45;color:#1C1208":"")+'" '
        +'onclick="modellAktiv(\''+s+'\','+i+')" title="aktiv schalten">'+(e.aktiv?"●":"○")+'</button>'
        +'<div class="tx" onclick="modellBearbeiten(\''+s+'\','+i+')"><div class="ti">'+h(e.name||"ohne Namen")+'</div>'
        +'<div class="me">'+h(e.url||"keine Adresse")+(e.preis!==""&&e.preis!=null?" · "+h(e.preis)+" € "+(EINHEIT[s]||""):"")
        +(e.key?" · Schlüssel ✓":(e.woher?" · Schlüssel mitbenutzt":" · kein Schlüssel"))+'</div></div>'
        +'<button class="ik rot" onclick="modellWeg(\''+s+'\','+i+',\''+h(e.name).replace(/'/g,"")+'\')">✕</button></div>';
    });
    o+='</div><button class="knopf" style="width:100%;margin-top:9px" onclick="modellNeu(\''+s+'\')">+ Eigenes Modell</button></div>';
  });
  o+=tgKarte();
  o+='<div class="karte p"><div class="hinw" style="padding:0">Der orange Punkt links ist das Modell, das benutzt wird. '
   +'Auf den Namen tippen zum Ändern. Schlüssel werden gespeichert, aber nie wieder angezeigt.</div></div>';
  return o;
}

function modellFormular(titel,s,i,e){

  el("dialog").innerHTML='<div class="dim"><div class="dlg"><h2>'+h(titel)+'</h2>'
   +'<p>Slot: '+h(SLOTNAME[s]||s)+'</p>'

   +'<input type="text" id="mpreis" class="breit" placeholder="Preis '+(EINHEIT[s]||"je Einheit")+' in Euro, z.B. '+(BEISPIEL[s]||"0.04")+'" value="'+h(e.preis==null?"":e.preis)+'" style="margin-bottom:8px">'
   +'<input type="text" id="mkey" class="breit" placeholder="'+(e.key?"Schlüssel ersetzen (leer = behalten)":"Schlüssel")+'" style="margin-bottom:14px">'
   +'<div class="zw"><button class="knopf" onclick="zu()">Abbrechen</button>'
   +'<button class="knopf or" onclick="modellSpeichern(\''+s+'\','+i+')">Speichern</button></div></div></div>';
}
function modellNeu(s){modellFormular("Eigenes Modell",s,-1,{})}
function modellBearbeiten(s,i){modellFormular("Modell ändern",s,i,((S.modelle.apis||{})[s]||[])[i])}
function modellSpeichern(s,i){
  var d={slot:s,aktion:(i<0?"neu":"speichern"),i:i,
    name:el("mname").value,url:el("murl").value,preis:el("mpreis").value,key:el("mkey").value};
  api("/api/modelle?k="+S.kanal,d).then(function(r){zu();
    if(!r.ok)return melde(r.fehler||"ging nicht");
    ladeModelle().then(function(){api("/api/preis?k="+S.kanal).then(function(x){S.preis=x;zeichne()})});
  });
}
function modellAktiv(s,i){
  api("/api/modelle?k="+S.kanal,{slot:s,aktion:"aktiv",i:i}).then(function(){
    ladeModelle().then(function(){api("/api/preis?k="+S.kanal).then(function(x){S.preis=x;zeichne()})})});
}
function modellWeg(s,i,n){
  frage("Modell löschen?","<b>"+h(n)+"</b><br><br>Der Eintrag und sein Schlüssel werden gelöscht.","Löschen",
    function(){api("/api/modelle?k="+S.kanal,{slot:s,aktion:"weg",i:i}).then(function(){ladeModelle()})},true);
}


/* ---------- Eigene Szenen ---------- */
function ladeSzenen(){return api("/api/szenen?k="+S.kanal).then(function(d){S.szenen=d;
  return api("/api/preis?k="+S.kanal).then(function(x){S.preis=x;zeichne()})})}

function szeneSetz(id,feld,wert){
  api("/api/szenen?k="+S.kanal,{aktion:feld,id:id,wert:wert}).then(function(r){
    if(!r.ok)return melde(r.fehler||"ging nicht");ladeSzenen()})
}
function szeneSchieb(id,wohin){
  api("/api/szenen?k="+S.kanal,{aktion:wohin,id:id}).then(function(){ladeSzenen()})
}
function szeneWeg(id,name){
  frage("Szene löschen?","<b>"+h(name)+"</b><br><br>Die Szene und ihre Datei werden gelöscht.","Löschen",
    function(){api("/api/szenen?k="+S.kanal,{aktion:"weg",id:id}).then(function(){ladeSzenen()})},true)
}
function musikWeg(){
  frage("Lied entfernen?","Das hochgeladene Lied wird gelöscht.","Entfernen",
    function(){api("/api/szenen?k="+S.kanal,{aktion:"musik_weg"}).then(function(){ladeSzenen()})},true)
}

function hochladen(zweck,sid,nur){
  var i=document.createElement("input");
  i.type="file";
  i.accept=(zweck==="musik")?"audio/*"
    :(nur==="video"?"video/*":(nur==="bild"?"image/*":"image/*,video/*"));
  i.onchange=function(){
    var f=i.files&&i.files[0];if(!f)return;
    if(f.size>90*1024*1024){melde("Datei zu groß — höchstens 90 MB.");return}
    el("dialog").innerHTML='<div class="dim"><div class="dlg"><h2>Lädt hoch</h2><p id="hpro">'+h(f.name)+' · 0 %</p></div></div>';
    var x=new XMLHttpRequest();
    x.open("POST","/api/hochladen?k="+encodeURIComponent(S.kanal)+"&zweck="+zweck+"&name="+encodeURIComponent(f.name)+(sid?("&sid="+encodeURIComponent(sid)):""));
    x.upload.onprogress=function(e){if(e.lengthComputable&&el("hpro"))el("hpro").textContent=f.name+" · "+Math.round(e.loaded/e.total*100)+" %"};
    x.onload=function(){zu();var r={};try{r=JSON.parse(x.responseText)}catch(err){}
      if(!r.ok)return melde(r.fehler||"Hochladen ging nicht");
      R6.stand=null; ladeSzenen(); ladeClips()};
    x.onerror=function(){zu();melde("Hochladen fehlgeschlagen — Verbindung weg?")};
    x.send(f);
  };
  i.click();
}

function szeneNeu(id,hatClip){
  var warn=hatClip
    ? "<br><br><b>Achtung:</b> der vorhandene Clip ist dann noch vom alten Bild. "
      +"Er wird als veraltet markiert und muss neu erzeugt werden — das kostet noch einmal."
    : "";
  frage("Bild neu erzeugen?",
    "Nur f\u00fcr diese eine Szene wird ein neues Bild erzeugt. Das kostet den Preis f\u00fcr ein Bild."
    +"<br><br>Das jetzige Bild rutscht in den Verlauf, du kannst es zur\u00fcckholen."+warn,
    "Neu erzeugen",function(){
      el("dialog").innerHTML='<div class="dim"><div class="dlg"><h2>Wird erzeugt</h2><p>Einen Moment, das Bildmodell braucht ein paar Sekunden.</p></div></div>';
      api("/api/szene_neu?k="+encodeURIComponent(S.kanal),{sid:id}).then(function(r){
        zu();
        if(!r||!r.ok)return melde((r&&r.fehler)||"Das hat nicht geklappt");
        ladeSzenen();
      }).catch(function(){
        /* Das Bildmodell braucht bis zu einer Minute. Am Handy reisst
           die Verbindung in der Zeit gern ab - der Server malt aber
           weiter. Also nicht "ging nicht" melden, sondern nachsehen. */
        zu();
        melde("Die Verbindung ist abgerissen, während das Bild entstand. "
             +"Der Server malt weiter. In etwa einer Minute unten auf "
             +"<b>Neu laden</b> tippen, dann ist es da.");
        setTimeout(ladeSzenen,45000);
      });
    });
}

function szenenDauer(){
  var ges=0;
  ((S.szenen||{}).szenen||[]).forEach(function(s){
    ges+= s.gesprochen ? s.vorschlag : (Number(s.sekunden)||s.vorschlag);
  });
  return ges;
}

/* Clips r6 */
var R6 = {stand:null, tick:null};

function ladeClips(){
  return api("/api/clip_stand?k="+S.kanal).then(function(d){
    R6.stand=d;
    if(d&&d.laeuft){ if(!R6.tick) R6.tick=setInterval(ladeClips,5000); }
    else if(R6.tick){ clearInterval(R6.tick); R6.tick=null; ladeSzenen(); }
    zeichne();
  });
}
function clipStand(id){
  var l=((R6.stand||{}).szenen)||[];
  for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i];
  return null;
}
function clipLaeuftHier(id){
  var d=R6.stand||{};
  return !!(d.laeuft && (d.lauf||{}).sid===id);
}

/* ---------- Schalter, Verlauf und Nachfragen je Szene (r6) ---------- */

/* Der Schalter mit drei Stellungen. Er ersetzt Figur, Pose, Platz,
   Groesse und die alte KI-Animation. */
/* Wer in dieser Szene im Bild steht. Leere Liste heisst: die ganze
   Besetzung - deshalb schreibt die Oberflaeche beim ersten Antippen
   die volle Liste und nimmt dann einen heraus. */
function werZeile(s){
  if(s.modus!=="avatare")return "";
  if(!S.ds){ladeDarsteller();return ""}
  var dabei=(S.ds.darsteller||[]).filter(function(f){return f.dabei});
  if(!dabei.length)
    return '<div class="szh" style="margin-top:8px;color:#FFB454">Kein Avatar angehakt — '
     +'im Reiter <b>Avatare &amp; Sprecher</b> anhaken, sonst kann für diese Szene kein Clip entstehen.</div>';
  var wer=(s.wer&&s.wer.length)?s.wer:dabei.map(function(f){return f.id});
  var o='<div class="wer"><span class="szh" style="flex:0 0 100%">Wer steht im Bild</span>';
  dabei.forEach(function(f){
    var drin=wer.indexOf(f.id)>=0;
    o+='<button class="wn'+(drin?" an":"")+'" '
     +'onclick="szeneWer(\''+s.id+'\',\''+h(f.id)+'\')">'+h(f.name)+'</button>';
  });
  o+='</div>';
  var n=wer.length, je=Math.max(1,Math.floor(3/Math.max(1,n)));
  o+='<div class="szh" style="margin-top:5px">'
   +(n===1?('Allein im Bild — bekommt bis zu drei Referenzbilder von sich und bleibt sich '
            +'dadurch ähnlicher.')
          :(n+' Figuren — je bis zu '+je+' Referenzbild'+(je>1?'er':'')+'. '
            +'Weniger Figuren heißt ähnlichere Gesichter.'))
   +' Wer spricht, steht als Name vor der Zeile im Sprechtext — '
   +'sie können auch reden, ohne hier angewählt zu sein.</div>';
  return o;
}

function szeneWer(sid,did){
  var dabei=((S.ds||{}).darsteller||[]).filter(function(f){return f.dabei})
              .map(function(f){return f.id});
  var s=(((S.szenen||{}).szenen)||[]).filter(function(x){return x.id===sid})[0]||{};
  var wer=(s.wer&&s.wer.length)?s.wer.slice():dabei.slice();
  var i=wer.indexOf(did);
  if(i>=0)wer.splice(i,1); else wer.push(did);
  if(!wer.length)
    return melde("Mindestens eine Figur. Soll in der Szene niemand zu sehen sein, "
      +"stell den Schalter auf <b>Nur Bild</b>.");
  // In der Reihenfolge der Besetzung halten, damit nichts herumspringt
  wer=dabei.filter(function(x){return wer.indexOf(x)>=0});
  szeneSetz(sid,"wer",wer);
}

function schalterZeile(s,d){
  var modi=(d&&d.modi)||[["avatare","Avatare im Bild"],
                         ["bild_ki","Nur Bild animieren"],
                         ["bewegt","Kamerafahrt"],
                         ["still","Standbild"]];
  var jetzt=s.modus||"still";
  var o='<div class="schalt">';
  modi.forEach(function(m){
    o+='<button class="st'+(m[0]===jetzt?" an":"")+'" '
     +'onclick="szeneSetz(\''+s.id+'\',\'modus\',\''+m[0]+'\')">'+h(m[1])+'</button>';
  });
  o+='</div>';
  o+='<div class="szh" style="margin-top:5px">Der Schalter sagt nur, was man <b>sieht</b> — '
   +'geredet wird in allen vieren, wer redet steht im Sprechtext vor der Zeile.<br>'
   +'<b>Avatare im Bild</b>: KI-Clip, sie sind drin und gestikulieren. '
   +'<b>Nur Bild animieren</b>: KI-Clip vom Hintergrund, niemand zu sehen, sie reden aus dem Off. '
   +'Diese beiden kosten. '
   +'<b>Kamerafahrt</b>: Standbild, das langsam wandert. <b>Standbild</b>: es steht. '
   +'Die zwei sind gratis.</div>';
  if(s.eigener_clip)
    o+='<div class="szh" style="margin-top:5px;color:#E39B45">'
     +'Eigener Clip hochgeladen — Bild und Videomodell werden übersprungen.</div>';
  return o;
}

/* Die letzten Fassungen, antippbar. Nichts wird überschrieben. */
function versionen(s,welche){
  var li=((welche==="bild")?s.bild_alt:s.clip_alt)||[];
  if(!li.length)return "";
  var o='<div class="verl"><span class="szh">vorher</span>';
  li.forEach(function(n){
    var ruf='szeneZurueck(\''+s.id+'\',\''+welche+'\',\''+h(n)+'\')';
    o+=(welche==="bild")
      ? '<img alt="" src="/eigen/'+encodeURIComponent(n)+'?k='+S.kanal+'" title="zurückschalten" onclick="'+ruf+'">'
      : '<video src="/eigen/'+encodeURIComponent(n)+'?k='+S.kanal+'" muted preload="metadata" title="zurückschalten" onclick="'+ruf+'"></video>';
  });
  return o+'</div>';
}

function szeneZurueck(sid,welche,datei){
  frage("Zurückschalten?",
    (welche==="bild"?"Diese Szene nimmt wieder das ältere Bild."
                    :"Diese Szene nimmt wieder den älteren Clip.")
    +"<br><br>Die jetzige Fassung geht nicht verloren — sie rutscht in den Verlauf.",
    "Zurückschalten",function(){
      api("/api/szenen?k="+S.kanal,{aktion:"zurueck",id:sid,welche:welche,datei:datei})
        .then(function(r){
          if(!r||!r.ok)return melde((r&&r.fehler)||"ging nicht");
          R6.stand=null; ladeSzenen(); ladeClips();
        });
    });
}

function clipZeile(s){
  var st=clipStand(s.id)||{}, clip=st.clip||s.clip||"", stand=st.stand||s.clip_stand||"";
  var txt=st.text||s.clip_text||"", hier=clipLaeuftHier(s.id);
  var laeuft=(R6.stand||{}).laeuft;
  /* Die Regie steht oben im Feld "Animationsanweisung". Frueher stand
     sie hier ein zweites Mal - zwei Felder fuer denselben Wert. */
  var o='';
  if(s.clip_veraltet)
    o+='<div class="szz" style="display:block;color:#FFB454"><b>Der Clip ist noch vom alten Bild.</b>'
     +'<div class="szh">Du hast das Bild danach ausgetauscht. Erzeuge den Clip neu, '
     +'oder schalte unten auf das alte Bild zurück.</div></div>';

  if(hier){
    o+='<div class="szz p62" style="display:block;color:#FFB454;'
     +'border:2px solid #FFB454;border-radius:12px;padding:10px">'
     +'<b>● Clip läuft…</b> '+h(txt||"wird geschickt")
     +'<div class="szh">Das dauert ein paar Minuten. Du kannst die Seite zumachen.</div></div>';
    return o;
  }
  if(clip){
    /* Fertiger Clip: gruen umrandet, wie das fertige Video. */
    o+='<div class="szz p62" style="display:block;border:2px solid #37D67A;'
     +'border-radius:12px;padding:9px">'
     +'<div class="szh" style="color:#37D67A;margin-bottom:6px">● Clip fertig</div>'
     +(txt?'<div class="szh" style="margin-bottom:6px">'+h(txt)+'</div>':'')
     +'<video src="/eigen/'+encodeURIComponent(clip)+'?k='+S.kanal+'" controls playsinline muted '
     +'style="width:100%;max-height:300px;border-radius:9px;background:#000;display:block"></video>'
     +'<div style="display:flex;gap:7px;margin-top:7px">'
     +'<button class="knopf" style="flex:1"'+(laeuft?' disabled':'')
     +' onclick="clipNeu(\''+s.id+'\','+(s.clip_dauer||0)+',true)">Clip neu machen</button>'
     +'<button class="knopf" onclick="clipWeg(\''+s.id+'\')">Verwerfen</button>'
     +'</div>'
     +'<button class="knopf" style="width:100%;margin-top:7px"'+(laeuft?' disabled':'')
     +' onclick="nurMuender(\''+s.id+'\')">Nur Münder neu</button>'
     +versionen(s,"clip")
     +'<div class="szh" style="margin-top:4px">Dieser Clip wird ins Video übernommen. '
     +'Das Standbild wird dann nicht mehr gebraucht.</div></div>';
    return o;
  }
  o+='<div class="szz p62" style="display:block">'
   +'<button class="knopf" style="width:100%"'+(laeuft?' disabled':'')
   +' onclick="clipNeu(\''+s.id+'\','+(s.clip_dauer||0)+',false)">Clip erzeugen'
   +(s.clip_dauer?(' · '+s.clip_dauer+' s'):'')+'</button>';
  if(stand==="fehler"&&txt)
    o+='<div class="szh" style="margin-top:5px;color:#FFB454">'+h(txt)+'</div>';
  o+='</div>';
  return o;
}

function clipKarte(){
  var d=R6.stand;
  if(!d){ladeClips();return ''}
  var o='<div class="karte p"><h2 class="kt">Clips</h2>';
  if(d.ref_url&&d.ref_passt===false)
    o+='<div class="fehlt" style="margin-bottom:10px;cursor:default">'
     +'<b>Das ist das falsche Kling-Modell.</b><br>'
     +'Eingetragen: '+h(d.ref_url)+'<br>'
     +'Gebraucht wird eines mit <b>reference-to-video</b> in der Adresse. '
     +'Das andere macht nur Lippenbewegung zu einem fertigen Bild und kennt '
     +'deine Avatare nicht.</div>';
  else if(d.ref_url)
    o+='<div class="hinw" style="padding:0;margin-bottom:9px">Benutzt: <b>'
     +h(d.ref_name||"ohne Namen")+'</b> · '+h(d.ref_url)
     +'<br>Die Szene kommt von Kling oder MiniMax. Danach werden die Münder '
     +'auf die Stimmen gesetzt: links spricht, wer im Text zuerst drankommt, rechts der zweite.</div>';
  if(!d.bereit){
    o+='<div class="hinw" style="padding:0;color:#E39B45">'+h(d.grund||"noch nicht eingerichtet")+'</div>';
    o+='<div class="hinw" style="padding:0;margin-top:9px">Das Referenzmodell trägst du unter '
     +'<b>KI &amp; Technik</b> bei <b>Referenzclip</b> ein:<br>'
     +'Adresse <b>fal-ai/kling-video/o3/standard/reference-to-video</b><br>'
     +'Preis <b>0.112</b> je Sekunde · Schlüssel leer lassen, der von fal wird mitbenutzt.</div></div>';
    return o;
  }
  if(d.laeuft){
    var l=d.lauf||{};
    o+='<div class="hinw" style="padding:0;color:#FFB454"><b>Läuft.</b> '
     +(l.gesamt>1?('Szene '+(l.nummer||1)+' von '+l.gesamt+'. '):'')
     +h(l.text||"")+' · '+(l.dauer||0)+' s</div>'
     +'<button class="knopf" style="width:100%;margin-top:9px" onclick="clipStop()">Nach diesem Clip aufhören</button></div>';
    return o;
  }
  if(!d.offen){
    o+='<div class="hinw" style="padding:0">Alle Szenen haben einen Clip. '
     +'Das Video nimmt sie, wie sie sind.</div></div>';
    return o;

/* Was in dieser Szene eingestellt ist, im Klartext. Vor dem Erzeugen
   steht das in der Abfrage - ein falscher Schalter kostet sonst Geld,
   und man sieht es erst, wenn der Clip da ist. */
function szeneVon(id){
  return (((S.szenen||{}).szenen)||[]).filter(function(x){return x.id===id})[0]||{};
}
function clipLage(s){
  /* Ohne geladene Besetzung wuerde hier "niemand angehakt" stehen,
     obwohl welche angehakt sind. Dann lieber gar nichts behaupten. */
  var geladen=!!(S.ds&&S.ds.darsteller);
  var dabei=((S.ds||{}).darsteller||[]).filter(function(f){return f.dabei});
  var wer=(s.wer&&s.wer.length)?s.wer:dabei.map(function(f){return f.id});
  var namen=dabei.filter(function(f){return wer.indexOf(f.id)>=0})
                 .map(function(f){return f.name});
  var text=(s.text||"").trim();
  /* "Mara: ..." am Zeilenanfang - so steht im Sprechtext, wer redet. */
  var redner=[], gesehen={};
  text.split("\n").forEach(function(z){
    var m=/^\s*([A-Za-zÄÖÜäöüß][\wÄÖÜäöüß .'-]{0,28}?)\s*:\s*\S/.exec(z);
    if(m&&!gesehen[m[1]]){gesehen[m[1]]=1;redner.push(m[1].trim())}
  });
  return {namen:namen, text:text, redner:redner, modus:s.modus||"still",
          geladen:geladen};
}
/* Welche Laenge wirklich bestellt wird. Leer = jede Sekunde moeglich. */
function clipStufe(sek){
  var st=((R6.stand||{}).stufen)||[];
  if(!st.length||!sek)return 0;
  for(var i=0;i<st.length;i++){if(st[i]>=sek-0.2)return st[i]}
  return st[st.length-1];
}
function clipAbfrage(s,sek,preis,schon){
  var L=clipLage(s), o='';
  var zeile=function(k,v){return '<div style="margin-bottom:5px">'+k+': <b>'+v+'</b></div>'};
  var warn=[];
  if(L.modus==="avatare")
    o+=zeile("Im Bild",!L.geladen?"Besetzung noch nicht geladen"
             :(L.namen.length?h(L.namen.join(", ")):"niemand angehakt"));
  else if(L.modus==="bild_ki")
    o+=zeile("Im Bild","niemand — nur der Hintergrund wird animiert");
  else
    o+=zeile("Im Bild","Standbild"+(L.modus==="bewegt"?" mit Kamerafahrt":", ohne Bewegung"));
  o+=zeile("Gesprochen", L.redner.length?(h(L.redner.join(", "))
            +(L.modus==="avatare"?"":" — aus dem Off"))
          :(L.text?"ja, ohne Namen davor":"nichts eingetragen"));
  if(sek){
    var best=clipStufe(sek);
    o+=zeile("Länge der Szene",sek+" Sekunden");
    if(best&&best!==sek)
      o+=zeile("Bestellt wird",best+" Sekunden"
        +(best>sek?" — der Rest wird abgeschnitten":""));
    if(best&&best<sek)
      warn.push("Das Modell kann höchstens <b>"+best+" Sekunden</b>. Die letzten "
        +(Math.round((sek-best)*10)/10)+" Sekunden der Szene werden mit einem "
        +"stehenden Bild aufgefüllt. Kürze den Sprechtext, dann passt es.");
  }
  if(preis)o+=zeile("Kostet etwa",preis.toFixed(2).replace(".",",")+" €");
  if(L.geladen&&L.modus==="avatare"&&!L.namen.length)
    warn.push("Der Schalter steht auf <b>Avatare im Bild</b>, aber es ist niemand angehakt.");
  if(L.geladen&&L.modus==="bild_ki"&&L.namen.length)
    warn.push("Der Schalter steht auf <b>Nur Bild animieren</b> — die angehakten Avatare "
             +"kommen nicht ins Bild, sie reden nur.");
  if(!L.text)
    warn.push("Im Sprechtext steht nichts. Die Szene bleibt stumm.");
  if(!(s.bild||s.datei))
    warn.push("Diese Szene hat noch kein Bild.");
  if(warn.length)
    o+='<div style="margin-top:10px;color:#FFB454">'+warn.join("<br>")+'</div>';
  if(schon)o+='<div style="margin-top:10px">Der jetzige Clip geht nicht verloren — '
    +'er rutscht in den Verlauf.</div>';
  return o;
}

/* Ein Knopf. Dateiwaehler auf, Bilder markieren, fertig - ohne id legt
   das erste Bild einen neuen Avatar an und benennt ihn nach der Datei. */
function dsHoch(did){
  var bmax=((S.ds||{}).bilder_max)||4, frei=bmax;
  if(did){
    var f=((S.ds||{}).darsteller||[]).filter(function(x){return x.id===did})[0];
    if(f)frei=bmax-((f.bilder||[]).length);
  }
  if(frei<1)return melde("Dieser Avatar hat schon "+bmax+" Bilder.");
  var i=document.createElement("input");
  i.type="file"; i.accept="image/*"; i.multiple=true;
  i.onchange=function(){
    var dateien=[].slice.call(i.files||[]);
    if(!dateien.length)return;
    var uebrig=dateien.length-frei;
    if(uebrig>0)dateien=dateien.slice(0,frei);
    dsSchicken(dateien,did||"",0,dateien.length,uebrig>0?bmax:0);
  };
  i.click();
}

/* Schickt die Bilder nacheinander. Das erste bekommt die id zurueck, die
   weiteren haengen sich an denselben Avatar. */
function dsSchicken(dateien,did,nr,gesamt,zuviel){
  if(nr>=dateien.length){
    zu(); ladeDarsteller();
    if(zuviel)melde("Mehr als "+zuviel+" Bilder nimmt das Modell nicht an — "
      +"die übrigen habe ich weggelassen.");
    return;
  }

  if(f.size>90*1024*1024){zu();ladeDarsteller();
    return melde("„"+f.name+"“ ist zu groß — höchstens 90 MB.")}
  var wo=f.name+(gesamt>1?(" · Bild "+(nr+1)+" von "+gesamt):"");
  el("dialog").innerHTML='<div class="dim"><div class="dlg"><h2>Lädt hoch</h2>'
    +'<p id="dspro">'+h(wo)+' · 0 %</p></div></div>';
  var x=new XMLHttpRequest();
  x.open("POST","/api/hochladen?k="+encodeURIComponent(S.kanal)+"&zweck=darsteller"
    +"&id="+encodeURIComponent(did)+"&name="+encodeURIComponent(f.name));
  x.upload.onprogress=function(e){
    if(e.lengthComputable&&el("dspro"))
      el("dspro").textContent=wo+" · "+Math.round(e.loaded/e.total*100)+" %"};
  x.onload=function(){
    var r={};try{r=JSON.parse(x.responseText)}catch(err){}
    if(!r.ok){zu();ladeDarsteller();return melde(r.fehler||"Hochladen ging nicht")}
    dsSchicken(dateien,did||r.id||"",nr+1,gesamt,zuviel);
  };
  x.onerror=function(){zu();ladeDarsteller();
    melde("Hochladen fehlgeschlagen — Verbindung weg?")};
  x.send(f);
}

var STIMMTON=null;
/* Der Knopf blieb frueher auf "…" stehen: zurueckgesetzt wurde er nur,
   wenn die Probe zu Ende lief. Beim Wechsel auf eine andere Stimme wurde
   die alte nur angehalten - der alte Knopf hat das nie erfahren. Jetzt
   merkt sich die Seite, welcher Knopf dran ist, und gibt ihn in jedem
   Fall wieder frei: bei Ende, Abbruch, Fehler und nach 90 Sekunden. */
var STIMMKNOPF=null, STIMMUHR=null;
function stimmFrei(){
  if(STIMMUHR){clearTimeout(STIMMUHR);STIMMUHR=null}
  if(STIMMKNOPF){STIMMKNOPF.disabled=false;STIMMKNOPF.textContent="▶";STIMMKNOPF=null}
}
function stimmAus(){
  if(STIMMTON){try{STIMMTON.onended=STIMMTON.onerror=STIMMTON.onpause=STIMMTON.onplaying=null;
                   STIMMTON.pause()}catch(e){}}
  STIMMTON=null;
  stimmFrei();
}
function stimmProbe(sid,knopf){
  /* Laeuft gerade diese Stimme, hoert der zweite Tipper auf. */
  if(knopf&&knopf===STIMMKNOPF&&STIMMTON&&!STIMMTON.paused)return stimmAus();
  stimmAus();
  if(knopf){knopf.disabled=true;knopf.textContent="…";STIMMKNOPF=knopf}
  var a=new Audio("/api/stimmprobe?k="+encodeURIComponent(S.kanal)
                  +"&s="+encodeURIComponent(sid||"")+"&t="+Date.now());
  STIMMTON=a;
  a.onplaying=function(){if(STIMMKNOPF){STIMMKNOPF.disabled=false;STIMMKNOPF.textContent="■"}};
  a.onended=stimmFrei;
  a.onpause=stimmFrei;
  a.onerror=function(){stimmFrei();melde("Die Probe ging nicht. Steht bei den Modellen eine Stimme?")};
  STIMMUHR=setTimeout(function(){stimmAus();
    melde("Die Probe hat zu lange gebraucht. Nochmal tippen.")},90000);
  a.play().then(function(){}).catch(function(){stimmFrei();
    melde("Der Browser hat das Abspielen abgelehnt. Nochmal tippen.")});
}

  var alle=d.darsteller||[], max=d.max||3, anzahl=d.anzahl||0, bmax=d.bilder_max||4;
  var liste=alle.filter(function(f){return f.art!=="sprecher"});

  var o='<div class="karte p"><h2 class="kt">Avatare &amp; Sprecher</h2>'

function poseHochBewegt(n){

  i.onchange=function(){
    var f=i.files&&i.files[0];if(!f)return;

    var pose=prompt("Name der Bewegung (z.B. winkt, nickt, atmet)","Schleife");

      +encodeURIComponent(n)+"&pose="+encodeURIComponent(pose||"")+"&name="+encodeURIComponent(f.name));
    x.upload.onprogress=function(e){if(e.lengthComputable&&el("hpro"))el("hpro").textContent=f.name+" · "+Math.round(e.loaded/e.total*100)+" %"};
    x.onload=function(){zu();var r={};try{r=JSON.parse(x.responseText)}catch(err){}
      if(!r.ok){melde(r.fehler||"Hochladen ging nicht");return}
      ladeFiguren()};
    x.onerror=function(){zu();melde("Hochladen ging nicht")};
    x.send(f);
  };
  i.click();
}

  var alt=S.einst[feld]||"";
  if(alt.trim()===wert.trim())return melde("Der Vorschlag steht schon drin.");
  function setze(){var f=el(id);if(f)f.value=wert;setz(feld,wert)}
  if(!alt.trim()){setze();return}
  frage(titel+": Vorschlag einsetzen?",
    (warnung?"<b>"+h(warnung)+"</b><br><br>":"")
    +"Dein bisheriger Text wird dabei <b>\u00fcberschrieben</b> und ist weg.<br><br>"
    +"Bisher:<br><br><i>"+p86Kurz(alt)+"</i><br><br>"
    +"Vorschlag:<br><br><i>"+p86Kurz(wert)+"</i>",
    "\u00dcberschreiben",setze,true);
}

function ankerVorschlag(){
  /* Der alte feste Vorschlag war fuer die aufgeklebten Figuren
     geschrieben, die es nicht mehr gibt. Jetzt kommt er passend zum
     Masterprompt des Kanals. */
  var b=el("ankbtn");
  if(b){b.disabled=true;b.textContent="fragt nach…"}
  api("/api/stil_vorschlag?k="+S.kanal,{}).then(function(r){
    if(b){b.disabled=false;b.textContent="Vorschlag einsetzen"}
    if(!r||!r.ok||!r.text)return melde((r&&r.fehler)||"Kein Vorschlag bekommen");
    p86Vorschlag("stil_zusatz","Stil-Anker","anker",r.text,"");
  }).catch(function(e){
    if(b){b.disabled=false;b.textContent="Vorschlag einsetzen"}
    melde("Die Anfrage kam nicht durch: "+(e&&e.message?e.message:"unbekannt"));
  });
}




/* Die Szenen der letzten Geschichte stehen sonst unter der neuen weiter -
   samt Clips, fuer die schon bezahlt wurde. Vor dem Schreiben wird
   deshalb gefragt, und dann werden sie geleert. */
function textSchreiben(){
  var weiter=function(){
    var li=((S.szenen||{}).szenen)||[];
    if(!li.length)return textSchreibenLos();
    var mitClip=li.filter(function(s){return s.clip}).length;
    frage("Neue Geschichte schreiben?",
      "Aus der letzten Geschichte stehen noch <b>"+li.length+" Szenen</b> da"
      +(mitClip?(", davon <b>"+mitClip+" mit fertigem Clip</b>"):"")+".<br><br>"
      +"Die werden vorher geleert — sonst hängen sie unter der neuen Geschichte."
      +(mitClip?"<br><br><span style=\"color:#FFB454\">Die fertigen Clips sind damit weg. "
                +"Willst du sie behalten, brich ab und sichere sie zuerst.</span>":""),
      "Leeren und schreiben",function(){
        api("/api/szenen?k="+S.kanal,{aktion:"alle_weg"}).then(function(){
          ladeSzenen(); textSchreibenLos();
        },function(){melde("Die alten Szenen ließen sich nicht leeren.")});
      },true);
  };
  if(!S.szenen&&typeof ladeSzenen==="function")ladeSzenen().then(weiter,weiter);
  else weiter();
}
function textSchreibenLos(){
  var b=el("gsknopf"); if(!b)return;
  var thema=(el("gsthema")||{}).value||"";
  var bisher=(el("gstext")||{}).value||"";
  b.disabled=true; b.textContent="schreibt…";
  api("/api/vorschlag?k="+S.kanal,{thema:thema,bisher:bisher}).then(function(r){
    b.disabled=false; b.textContent="Schreiben";
    if(!r||!r.ok)return melde((r&&r.fehler)||"Die Text-KI hat nicht geantwortet");
    var d={geschichte_teil:0};
    if(r.thema&&r.thema_aus_liste)d.geschichte_thema=r.thema;
    d.geschichte_serie="";
    d.geschichte_text=r.text;
    var f=el("gstext"); if(f)f.value=d.geschichte_text;
    setzViele(d).then(function(){
      if(typeof ladeSzenen==="function")ladeSzenen();
      melde((r.titel?r.titel+" · ":"")+r.szenen+" Szenen geschrieben. Lies drüber, dann erzeugen.");
    });
  }).catch(function(){
    b.disabled=false; b.textContent="Schreiben";
    melde("Verbindung abgebrochen. Das Schreiben dauert bis zu zwei Minuten.");
  });
}

 });
